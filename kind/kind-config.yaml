# Cluster Kubernetes local "lab". Un seul noeud suffit (control-plane qui exécute aussi les pods).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab
nodes:
  - role: control-plane
    extraPortMappings:           # rend Grafana / Prometheus accessibles depuis Windows sans port-forward
      - {containerPort: 30300, hostPort: 3000, listenAddress: "127.0.0.1", protocol: TCP}   # Grafana
      - {containerPort: 30090, hostPort: 9090, listenAddress: "127.0.0.1", protocol: TCP}   # Prometheus
